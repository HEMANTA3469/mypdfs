{% extends "base.html" %}

{% block title %}Register - Education PDF Store{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <div style="font-size:55px;">
                            👨‍🎓
                        </div>

                        <h2 class="fw-bold">
                            Create Account
                        </h2>

                        <p class="text-muted">
                            Join our Education PDF Store
                        </p>

                    </div>


                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter your full name"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Mobile Number
                            </label>

                            <input
                                type="tel"
                                name="mobile"
                                class="form-control"
                                placeholder="Enter mobile number">

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Password"
                                    required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    name="confirm_password"
                                    class="form-control"
                                    placeholder="Confirm password"
                                    required>

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100">

                            Create Account

                        </button>

                    </form>


                    <div class="text-center mt-4">

                        Already have an account?

                        <a
                            href="{{ url_for('login') }}"
                            class="fw-bold text-decoration-none">

                            Login

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
