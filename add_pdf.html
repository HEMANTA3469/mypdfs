{% extends "base.html" %}

{% block title %}Add PDF - Admin{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold mb-1">➕ Add New PDF</h2>
            <p class="text-muted mb-0">
                Upload a new educational PDF product
            </p>
        </div>

        <a href="{{ url_for('admin_pdfs') }}"
           class="btn btn-outline-secondary">
            ⬅ Back to PDFs
        </a>

    </div>


    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body p-4 p-md-5">

                    <form method="POST"
                          action="{{ url_for('admin_add_pdf') }}"
                          enctype="multipart/form-data">

                        <!-- TITLE -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                PDF Title
                                <span class="text-danger">*</span>
                            </label>

                            <input type="text"
                                   name="title"
                                   class="form-control"
                                   placeholder="Enter PDF title"
                                   required>

                        </div>


                        <!-- CATEGORY -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Category
                            </label>

                            <input type="text"
                                   name="category"
                                   class="form-control"
                                   placeholder="Example: Education">

                        </div>


                        <!-- DESCRIPTION -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Description
                            </label>

                            <textarea name="description"
                                      class="form-control"
                                      rows="5"
                                      placeholder="Enter PDF description"></textarea>

                        </div>


                        <!-- PRICE -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Price (₹)
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">₹</span>

                                <input type="number"
                                       name="price"
                                       class="form-control"
                                       value="0"
                                       min="0"
                                       step="0.01">

                            </div>

                        </div>


                        <!-- PDF FILE -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                PDF File
                                <span class="text-danger">*</span>
                            </label>

                            <input type="file"
                                   name="pdf_file"
                                   class="form-control"
                                   accept=".pdf,application/pdf"
                                   required>

                            <small class="text-muted">
                                Only PDF files are allowed.
                            </small>

                        </div>


                        <!-- THUMBNAIL -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Thumbnail Image
                            </label>

                            <input type="file"
                                   name="thumbnail"
                                   class="form-control"
                                   accept=".jpg,.jpeg,.png,.webp,image/*">

                            <small class="text-muted">
                                JPG, JPEG, PNG or WEBP.
                            </small>

                        </div>


                        <!-- ACTIVE -->
                        <div class="form-check form-switch mb-4">

                            <input class="form-check-input"
                                   type="checkbox"
                                   name="is_active"
                                   value="1"
                                   id="isActive"
                                   checked>

                            <label class="form-check-label fw-semibold"
                                   for="isActive">
                                PDF Active
                            </label>

                        </div>


                        <!-- BUTTON -->
                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary px-4">
                                💾 Add PDF
                            </button>

                            <a href="{{ url_for('admin_pdfs') }}"
                               class="btn btn-outline-secondary px-4">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
